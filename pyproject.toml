[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-arb-bot"
version = "0.1.0"
description = "Self-hosted arbitrage + directional trading bot for Kalshi and Polymarket US (QCEX)."
requires-python = ">=3.11"
# The deterministic core (models, fees, arbitrage, risk, book, store) depends only
# on the standard library so the test suite runs with no third-party installs.
# Venue adapters and the local-LLM analyst pull their dependencies lazily.
dependencies = []

[project.optional-dependencies]
venues = [
    "httpx>=0.27",
    "websockets>=12",
    "cryptography>=42",   # Ed25519 request signing for Polymarket US / QCEX
    "numpy>=1.26",        # fast all-pairs cosine for semantic matching
]
dev = [
    "pytest>=8",
]

[tool.ruff]
# The codebase deliberately uses wide, prose-heavy lines (explanatory comments inline
# with money-critical logic). 100 matches the house style; without this, ruff's 88
# default floods E501 false positives and hides the real findings.
line-length = 100

[tool.ruff.lint]
# Defaults (E, F) plus a few high-signal bug/cleanliness families.
extend-select = ["B", "SIM", "RUF", "C4", "PIE"]
ignore = [
    "RUF015",  # next(iter(x)) over x[0] — x[0] is clearer here
    "SIM118",  # `k in dict.keys()` — explicit and readable
    "RUF001",  # ambiguous unicode (the en dash in the scoreline regex is intentional)
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assign lambdas (fakes), import after a docstring-demo, use short
# throwaway names, and build fixtures in ways the bug-bear rules dislike.
"tests/*" = ["E731", "E402", "E741", "E702", "B", "SIM105", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["bot*"]
